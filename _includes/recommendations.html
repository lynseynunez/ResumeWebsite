{%- assign max = include.limit | default: 99 -%}
<div class="quotes">
  {%- for r in site.data.recommendations limit: max %}
  <figure class="quote">
    <blockquote><p>&ldquo;{{ r.quote }}&rdquo;</p></blockquote>
    <figcaption>
      <img src="{{ '/assets/img/' | append: r.photo | relative_url }}" width="48" height="48" alt="" loading="lazy">
      <span><span class="who">{{ r.name }}</span><span class="what">{{ r.title }}</span></span>
    </figcaption>
  </figure>
  {%- endfor %}
</div>
