<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">LN</a>
  <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
  <nav id="site-nav" class="site-nav" aria-label="Primary">
    {%- assign links = "Home|/,Resume|/resume/,Case Studies|/case-studies/,Portfolio|/portfolio/,Connect|/connect/" | split: "," -%}
    {%- for l in links -%}
      {%- assign p = l | split: "|" -%}
      <a href="{{ p[1] | relative_url }}"{% if page.url == p[1] %} aria-current="page"{% endif %}>{{ p[0] }}</a>
    {%- endfor -%}
  </nav>
</header>
