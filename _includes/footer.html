<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <p class="footer-name gradient-text">{{ site.author.name }}</p>
      <p>{{ site.tagline }}</p>
    </div>
    <nav class="footer-nav" aria-label="Footer">
      <a href="{{ '/resume/' | relative_url }}">Resume</a>
      <a href="{{ '/case-studies/' | relative_url }}">Case Studies</a>
      <a href="{{ '/portfolio/' | relative_url }}">Portfolio</a>
      <a href="{{ '/connect/' | relative_url }}">Connect</a>
    </nav>
    <div class="footer-contact">
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
  <p class="footer-copy">&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
</footer>
